# Collector for site sh-north. Runs inside the site network; only reaches its own hosts and the central server.
name: sh-north
central_url: http://central:8000
token_env: INSPECTOR_COLLECTOR_TOKEN
spool_path: /var/lib/inspector/spool.db

ssh:
  client: openssh          # system ssh + key; paramiko also supported (password or key)
  timeout: 10
  control_dir: /var/lib/inspector/ssh   # reuse SSH connections (keep the path short: socket limit)
  # known_hosts: /etc/inspector/known_hosts   # production: pin host keys

defaults:
  username: inspector      # read-only account, no sudo
  key_file: /keys/id_ed25519
  mounts: ["/", "/data"]
  services: ["nginx", "crond"]

hosts:
  - {name: sh01-a01-srv01, address: sh01-a01-srv01, datacenter: SH01}
  - {name: sh02-a01-srv01, address: sh02-a01-srv01, datacenter: SH02}
  - {name: sh03-a01-srv01, address: sh03-a01-srv01, datacenter: SH03}
  - {name: sh04-a01-srv01, address: sh04-a01-srv01, datacenter: SH04}
  - {name: sh05-a01-srv01, address: sh05-a01-srv01, datacenter: SH05}
