# Example inventory. Real secrets go in group_vars/*/vault.yml (ansible-vault encrypt).

[central]
inspector-central-01 ansible_host=10.0.0.10

[collectors]
collector-sh-north ansible_host=10.1.0.5  collector_name=sh-north
collector-sh-south ansible_host=10.6.0.5  collector_name=sh-south

# Hosts to be inspected: the play creates the read-only inspection account and installs the key.
[inspected_hosts:children]
site_north
site_south

[site_north]
sh01-a01-srv01 ansible_host=10.1.1.11
sh02-a01-srv01 ansible_host=10.2.1.11

[site_south]
sh06-a01-srv01 ansible_host=10.6.1.11
