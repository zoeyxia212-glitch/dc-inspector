# NOT applied by kustomization.yaml. Create real secrets out of band, e.g.:
#   kubectl -n dc-inspector create secret generic central-secrets \
#     --from-literal=INSPECTOR_SECRET_KEY=$(python -c "import secrets; print(secrets.token_hex(32))") \
#     --from-literal=INSPECTOR_ADMIN_PASSWORD=... --from-literal=TOKEN_SH_NORTH=... ...
#   kubectl -n dc-inspector create secret generic collector-sh-north \
#     --from-literal=token=... --from-file=ssh-private-key=./id_ed25519
# or manage them with External Secrets / Sealed Secrets / Vault.
apiVersion: v1
kind: Secret
metadata:
  name: central-secrets
type: Opaque
stringData:
  INSPECTOR_SECRET_KEY: change-me
  INSPECTOR_ADMIN_PASSWORD: change-me
  TOKEN_SH_NORTH: replace-with-output-of-gen-token  # python -m inspector.main gen-token
  INSPECTOR_METRICS_TOKEN: ""
  WECOM_WEBHOOK_URL: ""
  DINGTALK_WEBHOOK_URL: ""
  DINGTALK_SECRET: ""
  SLACK_WEBHOOK_URL: ""
  SMTP_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: collector-sh-north
type: Opaque
stringData:
  token: change-me-at-least-24-characters
  ssh-private-key: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    (the inspection account's private key)
    -----END OPENSSH PRIVATE KEY-----
