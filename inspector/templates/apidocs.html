<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DC Inspector API</title>
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
<style>body { margin: 0; } .topbar { display: none; }</style>
</head>
<body>
<div id="docs"><p style="font-family: system-ui; padding: 24px">Loading API documentation…
  (needs access to unpkg.com; offline, read <a href="/api/v1/openapi.json">/api/v1/openapi.json</a>)</p></div>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin="anonymous"></script>
<script>
  window.addEventListener("load", () => {
    if (!window.SwaggerUIBundle) return;
    SwaggerUIBundle({url: "/api/v1/openapi.json", dom_id: "#docs", deepLinking: true,
                     tryItOutEnabled: false, defaultModelsExpandDepth: 0});
  });
</script>
</body>
</html>
